[project]
name = "autoformfill"
version = "1.0.0"
description = "AI agent that fills web forms from a parsed resume, using Playwright and an LLM on Groq."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "groq>=0.9",
    "pydantic>=2.5",
    "pymupdf>=1.23",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
autoformfill = "autoformfill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autoformfill"]

[tool.setuptools.package-data]
autoformfill = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
